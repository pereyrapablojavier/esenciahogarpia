<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIA · Esencia Hogar — Gestión (prototipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Niramit:wght@400;500;600;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#6e6043; --primary-dark:#4f442f; --primary-soft:#efe9dc;
  --gray:#9b9a9a; --ink:#3b3426; --bg:#faf8f3; --card:#ffffff; --line:#e8e2d4;
  --ok:#4bb98c; --danger:#dd7774; --warn:#dc8f38; --info:#71b5dc; --cactus:#3f7d4e;
  --hf:"Niramit",sans-serif; --bf:"Rubik",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--bf);font-size:15px}
h1,h2,h3{font-family:var(--hf);margin:0;font-weight:600;color:var(--primary-dark)}
button{font-family:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:#fff;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{padding:4px 10px 18px}
.brand .pia{font-family:var(--hf);font-size:34px;font-weight:700;letter-spacing:.12em;color:var(--primary);line-height:1}
.brand .sub{font-family:var(--hf);font-size:11px;letter-spacing:.32em;color:var(--gray);text-transform:uppercase;margin-top:4px}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;color:var(--gray);font-size:15px}
nav button svg{width:20px;height:20px;flex:none}
nav button:hover{background:var(--primary-soft);color:var(--primary)}
nav button.on{background:var(--primary);color:#fff}
.foot{margin-top:auto;font-size:12px;color:var(--gray);padding:10px}
main{padding:28px 32px 60px;max-width:1150px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font-size:28px}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--primary-soft);color:var(--primary);font-weight:500;white-space:nowrap}
.tag.ok{background:#e1f4ec;color:#2d8a66}.tag.bad{background:#fbe6e5;color:#b84a47}.tag.warn{background:#fbecd8;color:#a8661a}.tag.info{background:#e3f1f9;color:#3b86ad}
.btn{background:var(--primary);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:500}
.btn:hover{background:var(--primary-dark)}
.btn.ghost{background:#fff;color:var(--primary);border:1px solid var(--primary)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kpi .l{font-size:12px;color:var(--gray);text-transform:uppercase;letter-spacing:.08em}
.kpi .v{font-family:var(--hf);font-size:28px;font-weight:600;color:var(--primary-dark);margin-top:4px}
.kpi .s{font-size:12px;color:var(--gray);margin-top:2px}
.two{grid-template-columns:1fr 1fr}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:99px;color:var(--gray)}
.tabs button.on{background:var(--primary);border-color:var(--primary);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--gray);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.r{text-align:right}
.tw{overflow-x:auto}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15);vertical-align:-2px;margin-right:6px}
.bar{height:7px;background:var(--primary-soft);border-radius:9px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--primary)}
.bar.low i{background:var(--danger)}
.qty{display:inline-flex;align-items:center;gap:6px}
.qty button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--primary);font-size:16px;line-height:1}
input,select{font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus{outline:2px solid var(--primary-soft);border-color:var(--primary)}
input.n{width:92px;text-align:right}
label{font-size:12px;color:var(--gray);display:block;margin-bottom:3px}
.form{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.form .full{grid-column:1/-1}
.modal{position:fixed;inset:0;background:rgba(59,52,38,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:560px;max-height:90vh;overflow:auto}
.modal h2{margin-bottom:14px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.muted{color:var(--gray);font-size:13px}
.alert{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.alert:last-child{border:0}
.line{display:grid;grid-template-columns:1fr 80px 30px;gap:8px;margin-bottom:8px;align-items:center}
.note{background:var(--primary-soft);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--primary-dark);margin-bottom:14px}
.pos{color:#2d8a66;font-weight:500}.neg{color:#b84a47;font-weight:500}
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;padding:6px;border-right:0;border-top:1px solid var(--line);z-index:10;justify-content:space-around}
  .brand,.foot{display:none}
  nav{display:flex;width:100%;justify-content:space-around}
  nav button{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;text-align:center;justify-content:center;width:auto}
  main{padding:18px 14px 90px}
  .two{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="pia">PIA</div><div class="sub">Esencia Hogar</div></div>
    <nav id="nav"></nav>
    <div class="foot">Prototipo · datos de ejemplo<br>Los precios, comisiones y costos son editables.</div>
  </aside>
  <main id="main"></main>
</div>
<div class="modal" id="modal"><div class="box" id="box"></div></div>

<script>
/* ---------- Datos de ejemplo (en la versión real vienen de Supabase) ---------- */
const S = {
  config:{costoHora:350, margenObjetivo:40},
  canales:[
    {id:'ml', nombre:'Mercado Libre', com:14, fijo:1500},
    {id:'tn', nombre:'Tienda Nube', com:3.5, fijo:0},
    {id:'ig', nombre:'Instagram / WhatsApp', com:0, fijo:0}
  ],
  filamentos:[
    {id:1, marca:'Grilon3', material:'PLA', color:'Verde cactus', hex:'#3f7d4e', costoKg:22000, rollo:1000, resta:120},
    {id:2, marca:'Grilon3', material:'PLA', color:'Crema', hex:'#efe6cf', costoKg:22000, rollo:1000, resta:560},
    {id:3, marca:'Printalot', material:'PLA', color:'Blanco', hex:'#f4f4f2', costoKg:20500, rollo:1000, resta:740},
    {id:4, marca:'Grilon3', material:'PETG', color:'Negro', hex:'#2b2b2b', costoKg:26000, rollo:1000, resta:900}
  ],
  insumos:[
    {id:1, nombre:'Caja chica de envío', cat:'Packaging', un:'u', cant:40, min:20, costo:450},
    {id:2, nombre:'Bolsa kraft', cat:'Packaging', un:'u', cant:120, min:50, costo:90},
    {id:3, nombre:'Frasco spray 200 ml', cat:'Aromas', un:'u', cant:25, min:30, costo:800},
    {id:4, nombre:'Esencia lavanda', cat:'Aromas', un:'ml', cant:480, min:200, costo:18},
    {id:5, nombre:'Base alcohol aromático', cat:'Aromas', un:'ml', cant:3200, min:1000, costo:3},
    {id:6, nombre:'Arcilla', cat:'Cerámica', un:'kg', cant:12, min:5, costo:1900},
    {id:7, nombre:'Esmalte blanco', cat:'Cerámica', un:'ml', cant:900, min:300, costo:6},
    {id:8, nombre:'Cera de soja', cat:'Aromas', un:'kg', cant:4, min:2, costo:7500}
  ],
  productos:[
    {id:1, nombre:'Cactus · Colección Botánica', linea:'3D', fil:[{id:1,g:45},{id:2,g:30}], horas:3.5, ins:[{id:1,q:1}], directo:0, stock:6, precios:{ml:14900,tn:12500,ig:11900}},
    {id:2, nombre:'Maceta Nido', linea:'3D', fil:[{id:2,g:120}], horas:5, ins:[{id:1,q:1}], directo:0, stock:3, precios:{ml:12900,tn:10900,ig:9900}},
    {id:3, nombre:'Home Spray Nano 200 ml', linea:'Aromas', fil:[], horas:0, ins:[{id:3,q:1},{id:4,q:20},{id:5,q:180},{id:2,q:1}], directo:0, stock:12, precios:{ml:9800,tn:8100,ig:7500}},
    {id:4, nombre:'Plato Playo «Nido Botánico»', linea:'Cerámica', fil:[], horas:0, ins:[{id:6,q:0.6},{id:7,q:40},{id:1,q:1}], directo:1800, stock:4, precios:{ml:16000,tn:13500,ig:12800}},
    {id:5, nombre:'Vela de soja', linea:'Aromas', fil:[], horas:0, ins:[{id:8,q:0.25},{id:2,q:1}], directo:900, stock:8, precios:{ml:8900,tn:7500,ig:6900}}
  ],
  pedidos:[
    {id:1, fecha:'2026-11-20', cliente:'Lucía M.', canal:'ig', items:[{p:3,q:2}], estado:'Entregado'},
    {id:2, fecha:'2026-11-22', cliente:'Pedido ML #4471', canal:'ml', items:[{p:1,q:1},{p:2,q:1}], estado:'Enviado'},
    {id:3, fecha:'2026-11-24', cliente:'Carla R.', canal:'tn', items:[{p:4,q:2}], estado:'Preparando'}
  ],
  tabStock:'filamentos', tabProd:'todas', view:'panel'
};
const ESTADOS=['Pendiente','Preparando','Enviado','Entregado'];
const $=s=>document.querySelector(s);
const money=n=>'$ '+Math.round(n).toLocaleString('es-AR');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byId=(arr,id)=>arr.find(x=>x.id==id);
const canal=id=>S.canales.find(c=>c.id===id);

/* ---------- Cálculos ---------- */
function costo(p){
  const f=p.fil.reduce((a,x)=>a+x.g*byId(S.filamentos,x.id).costoKg/1000,0);
  const i=p.ins.reduce((a,x)=>a+x.q*byId(S.insumos,x.id).costo,0);
  return f+i+p.horas*S.config.costoHora+p.directo;
}
function neto(p,c,precio){return precio*(1-c.com/100)-c.fijo}
function sugerido(p,c){const m=S.config.margenObjetivo/100;return (costo(p)+c.fijo)/(1-c.com/100-m)}
function totalPedido(o){return o.items.reduce((a,i)=>a+i.q*(byId(S.productos,i.p).precios[o.canal]||0),0)}
function gananciaPedido(o){const c=canal(o.canal);return o.items.reduce((a,i)=>{const p=byId(S.productos,i.p);return a+i.q*(neto(p,c,p.precios[o.canal]||0)-costo(p))},0)+0}
function alertas(){
  const a=[];
  S.filamentos.forEach(f=>{if(f.resta<f.rollo*0.2)a.push({t:`${f.material} ${f.color}`,d:`quedan ${f.resta} g`})});
  S.insumos.forEach(i=>{if(i.cant<i.min)a.push({t:i.nombre,d:`${i.cant} ${i.un} (mín. ${i.min})`})});
  return a;
}

/* ---------- Navegación ---------- */
const ICON={
  panel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  stock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>',
  productos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 21h10M12 21v-6M5 4h14l-1.5 8a5.5 5.5 0 01-11 0z"/></svg>',
  pedidos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2h12l2 5v14H4V7z"/><path d="M4 7h16M9 11h6"/></svg>',
  precios:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.3"/></svg>'
};
const VIEWS=[['panel','Panel'],['stock','Stock'],['productos','Productos'],['pedidos','Pedidos'],['precios','Precios']];
function drawNav(){
  $('#nav').innerHTML=VIEWS.map(([k,n])=>`<button class="${S.view===k?'on':''}" onclick="go('${k}')">${ICON[k]}<span>${n}</span></button>`).join('');
}
function go(v){S.view=v;location.hash=v;render()}
function render(){drawNav();({panel:vPanel,stock:vStock,productos:vProductos,pedidos:vPedidos,precios:vPrecios})[S.view]();window.scrollTo(0,0)}

/* ---------- Panel ---------- */
function vPanel(){
  const ped=S.pedidos.filter(o=>o.estado!=='Pendiente'||true);
  const ventas=ped.reduce((a,o)=>a+totalPedido(o),0);
  const gan=ped.reduce((a,o)=>a+gananciaPedido(o),0);
  const pend=S.pedidos.filter(o=>o.estado!=='Entregado').length;
  const al=alertas();
  const rank=S.productos.map(p=>{const c=canal('tn');return {p,m:neto(p,c,p.precios.tn)-costo(p)}}).sort((a,b)=>b.m-a.m);
  $('#main').innerHTML=`
  <div class="top"><div><h1>Hola 👋</h1><div class="muted">Resumen de Esencia Hogar PIA</div></div></div>
  <div class="grid kpis">
    <div class="card kpi"><div class="l">Ventas del mes</div><div class="v">${money(ventas)}</div><div class="s">${S.pedidos.length} pedidos</div></div>
    <div class="card kpi"><div class="l">Ganancia estimada</div><div class="v">${money(gan)}</div><div class="s">después de comisiones y costos</div></div>
    <div class="card kpi"><div class="l">Pedidos en curso</div><div class="v">${pend}</div><div class="s">sin entregar</div></div>
    <div class="card kpi"><div class="l">Alertas de stock</div><div class="v" style="color:${al.length?'#b84a47':'#2d8a66'}">${al.length}</div><div class="s">${al.length?'reponer pronto':'todo en orden'}</div></div>
  </div>
  <div class="grid two">
    <div class="card"><h3 style="margin-bottom:8px">Hay que reponer</h3>
      ${al.length?al.map(a=>`<div class="alert"><span>${esc(a.t)}</span><span class="tag bad">${esc(a.d)}</span></div>`).join(''):'<div class="muted">Nada por ahora.</div>'}
    </div>
    <div class="card"><h3 style="margin-bottom:8px">Productos más rentables <span class="muted">(Tienda Nube)</span></h3>
      ${rank.map(r=>`<div class="alert"><span>${esc(r.p.nombre)} <span class="tag">${r.p.linea}</span></span><span class="pos">${money(r.m)}</span></div>`).join('')}
    </div>
  </div>`;
}

/* ---------- Stock ---------- */
function vStock(){
  const t=S.tabStock;
  const tabs=[['filamentos','Filamentos'],['insumos','Insumos y materiales'],['terminados','Productos terminados']];
  let body='';
  if(t==='filamentos'){
    body=`<div class="tw"><table><thead><tr><th>Filamento</th><th>Color</th><th>Queda</th><th></th><th class="r">Costo/kg</th><th></th></tr></thead><tbody>
    ${S.filamentos.map(f=>{const pc=Math.min(100,f.resta/f.rollo*100);return `<tr>
      <td>${esc(f.marca)} · ${f.material}</td><td><span class="sw" style="background:${f.hex}"></span>${esc(f.color)}</td>
      <td style="min-width:120px"><div class="bar ${pc<20?'low':''}"><i style="width:${pc}%"></i></div></td>
      <td>${f.resta} g ${pc<20?'<span class="tag bad">poco</span>':''}</td><td class="r">${money(f.costoKg)}</td>
      <td class="r"><button class="btn ghost sm" onclick="editFil(${f.id})">Ajustar</button></td></tr>`}).join('')}</tbody></table></div>`;
  }else if(t==='insumos'){
    body=`<div class="tw"><table><thead><tr><th>Material</th><th>Categoría</th><th>Cantidad</th><th class="r">Costo unit.</th><th></th></tr></thead><tbody>
    ${S.insumos.map(i=>`<tr><td>${esc(i.nombre)}</td><td><span class="tag">${i.cat}</span></td>
      <td><span class="qty"><button onclick="adj('insumos',${i.id},-1)">−</button><b>${i.cant} ${i.un}</b><button onclick="adj('insumos',${i.id},1)">+</button></span> ${i.cant<i.min?'<span class="tag bad">bajo</span>':''}</td>
      <td class="r">${money(i.costo)}/${i.un}</td><td class="muted r">mín. ${i.min}</td></tr>`).join('')}</tbody></table></div>`;
  }else{
    body=`<div class="tw"><table><thead><tr><th>Producto</th><th>Línea</th><th>Unidades listas</th></tr></thead><tbody>
    ${S.productos.map(p=>`<tr><td>${esc(p.nombre)}</td><td><span class="tag">${p.linea}</span></td>
      <td><span class="qty"><button onclick="adj('productos',${p.id},-1,'stock')">−</button><b>${p.stock}</b><button onclick="adj('productos',${p.id},1,'stock')">+</button></span> ${p.stock<3?'<span class="tag warn">pocas</span>':''}</td></tr>`).join('')}</tbody></table></div>`;
  }
  $('#main').innerHTML=`<div class="top"><h1>Stock</h1>
    ${t==='insumos'?'<button class="btn" onclick="newIns()">+ Material</button>':t==='filamentos'?'<button class="btn" onclick="newFil()">+ Filamento</button>':''}</div>
    <div class="tabs">${tabs.map(([k,n])=>`<button class="${t===k?'on':''}" onclick="S.tabStock='${k}';render()">${n}</button>`).join('')}</div>
    <div class="card">${body}</div>`;
}
function adj(col,id,d,key='cant'){byId(S[col],id)[key]=Math.max(0,+(byId(S[col],id)[key]+d).toFixed(2));render()}
function openModal(html){$('#box').innerHTML=html;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function editFil(id){const f=byId(S.filamentos,id);
  openModal(`<h2>Ajustar ${esc(f.material)} ${esc(f.color)}</h2><div class="form">
  <div><label>Gramos que quedan</label><input id="a1" type="number" value="${f.resta}"></div>
  <div><label>Costo por kg ($)</label><input id="a2" type="number" value="${f.costoKg}"></div></div>
  <div class="acts"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveFil(${id})">Guardar</button></div>`)}
function saveFil(id){const f=byId(S.filamentos,id);f.resta=+$('#a1').value;f.costoKg=+$('#a2').value;closeModal();render()}
function newFil(){openModal(`<h2>Nuevo filamento</h2><div class="form">
  <div><label>Marca</label><input id="a1"></div>
  <div><label>Material</label><select id="a2"><option>PLA</option><option>PETG</option><option>ABS</option><option>TPU</option></select></div>
  <div><label>Color</label><input id="a3"></div>
  <div><label>Tono</label><input id="a4" type="color" value="#cccccc" style="height:38px;padding:3px"></div>
  <div><label>Costo por kg ($)</label><input id="a5" type="number" value="22000"></div>
  <div><label>Gramos del rollo</label><input id="a6" type="number" value="1000"></div></div>
  <div class="acts"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="addFil()">Agregar</button></div>`)}
function addFil(){if(!$('#a3').value.trim())return;const r=+$('#a6').value;
  S.filamentos.push({id:Date.now(),marca:$('#a1').value||'—',material:$('#a2').value,color:$('#a3').value,hex:$('#a4').value,costoKg:+$('#a5').value,rollo:r,resta:r});closeModal();render()}
function newIns(){openModal(`<h2>Nuevo material</h2><div class="form">
  <div class="full"><label>Nombre</label><input id="a1"></div>
  <div><label>Categoría</label><select id="a2"><option>Packaging</option><option>Aromas</option><option>Cerámica</option><option>3D</option><option>Otros</option></select></div>
  <div><label>Unidad</label><select id="a3"><option>u</option><option>g</option><option>ml</option><option>kg</option><option>l</option><option>m</option></select></div>
  <div><label>Cantidad</label><input id="a4" type="number" value="0"></div>
  <div><label>Stock mínimo</label><input id="a5" type="number" value="0"></div>
  <div class="full"><label>Costo por unidad ($)</label><input id="a6" type="number" value="0"></div></div>
  <div class="acts"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="addIns()">Agregar</button></div>`)}
function addIns(){if(!$('#a1').value.trim())return;
  S.insumos.push({id:Date.now(),nombre:$('#a1').value,cat:$('#a2').value,un:$('#a3').value,cant:+$('#a4').value,min:+$('#a5').value,costo:+$('#a6').value});closeModal();render()}

/* ---------- Productos ---------- */
function vProductos(){
  const lineas=['todas','3D','Cerámica','Aromas'];
  const list=S.productos.filter(p=>S.tabProd==='todas'||p.linea===S.tabProd);
  $('#main').innerHTML=`<div class="top"><h1>Productos</h1><button class="btn" onclick="newProd()">+ Producto</button></div>
  <div class="note">El costo se calcula solo: filamento (gramos × costo/kg) + horas de impresión + insumos + costo directo. Si cambia el precio del filamento, cambia el costo de todos los productos.</div>
  <div class="tabs">${lineas.map(l=>`<button class="${S.tabProd===l?'on':''}" onclick="S.tabProd='${l}';render()">${l==='todas'?'Todas':l}</button>`).join('')}</div>
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">
  ${list.map(p=>{const c=costo(p);
    const det=[...p.fil.map(x=>{const f=byId(S.filamentos,x.id);return `${x.g} g ${f.color}`}),p.horas?`${p.horas} h impresión`:null,...p.ins.map(x=>{const i=byId(S.insumos,x.id);return `${x.q} ${i.un} ${i.nombre.toLowerCase()}`}),p.directo?`directo ${money(p.directo)}`:null].filter(Boolean);
    return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><h3>${esc(p.nombre)}</h3><span class="tag">${p.linea}</span></div>
      <div class="muted" style="margin:8px 0;min-height:36px">${det.join(' · ')}</div>
      <div style="display:flex;justify-content:space-between;align-items:end"><div><div class="muted">Costo</div><b style="font-family:var(--hf);font-size:22px">${money(c)}</b></div>
      <div class="r"><div class="muted">Listos</div><b>${p.stock} u.</b></div></div></div>`}).join('')}
  </div>`;
}
function newProd(){openModal(`<h2>Nuevo producto</h2><div class="form">
  <div class="full"><label>Nombre</label><input id="a1"></div>
  <div><label>Línea</label><select id="a2"><option>3D</option><option>Cerámica</option><option>Aromas</option></select></div>
  <div><label>Unidades listas</label><input id="a3" type="number" value="0"></div>
  <div><label>Filamento (opcional)</label><select id="a4"><option value="">—</option>${S.filamentos.map(f=>`<option value="${f.id}">${esc(f.material)} ${esc(f.color)}</option>`).join('')}</select></div>
  <div><label>Gramos</label><input id="a5" type="number" value="0"></div>
  <div><label>Horas de impresión</label><input id="a6" type="number" step="0.5" value="0"></div>
  <div><label>Costo directo ($) · arcilla, cera, etc.</label><input id="a7" type="number" value="0"></div></div>
  <div class="muted" style="margin-top:10px">Los insumos de la receta (cajas, esencias, etc.) se suman en la versión completa.</div>
  <div class="acts"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="addProd()">Agregar</button></div>`)}
function addProd(){if(!$('#a1').value.trim())return;
  const fid=$('#a4').value;
  S.productos.push({id:Date.now(),nombre:$('#a1').value,linea:$('#a2').value,stock:+$('#a3').value,fil:fid&&+$('#a5').value?[{id:+fid,g:+$('#a5').value}]:[],horas:+$('#a6').value,ins:[],directo:+$('#a7').value,precios:{ml:0,tn:0,ig:0}});
  closeModal();render()}

/* ---------- Pedidos ---------- */
function vPedidos(){
  $('#main').innerHTML=`<div class="top"><h1>Pedidos</h1><button class="btn" onclick="newPed()">+ Pedido</button></div>
  <div class="card tw"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Canal</th><th>Productos</th><th class="r">Total</th><th class="r">Ganancia</th><th>Estado</th></tr></thead><tbody>
  ${[...S.pedidos].reverse().map(o=>{const g=gananciaPedido(o);return `<tr><td>${o.fecha.slice(5).split('-').reverse().join('/')}</td><td>${esc(o.cliente)}</td><td>${canal(o.canal).nombre}</td>
    <td>${o.items.map(i=>`${i.q}× ${esc(byId(S.productos,i.p).nombre)}`).join('<br>')}${o.faltan?`<br><span class="tag warn">a producir: ${o.faltan}</span>`:''}</td>
    <td class="r">${money(totalPedido(o))}</td><td class="r ${g>=0?'pos':'neg'}">${money(g)}</td>
    <td><button class="tag ${o.estado==='Entregado'?'ok':o.estado==='Enviado'?'info':o.estado==='Preparando'?'warn':''}" style="border:0;cursor:pointer" onclick="nextEstado(${o.id})" title="Click para avanzar">${o.estado} ›</button></td></tr>`}).join('')}
  </tbody></table></div>`;
}
function nextEstado(id){const o=byId(S.pedidos,id);const i=ESTADOS.indexOf(o.estado);o.estado=ESTADOS[(i+1)%ESTADOS.length];render()}
let draft=[{p:1,q:1}];
function newPed(){draft=[{p:S.productos[0].id,q:1}];pedModal()}
function pedModal(keep){
  const cv=keep||{c:'',ca:'ig'};
  const faltas=draft.map(l=>{const p=byId(S.productos,l.p);return Math.max(0,l.q-p.stock)});
  const aviso=draft.map((l,ix)=>{
    if(!faltas[ix])return '';
    const p=byId(S.productos,l.p);
    const need={};p.fil.forEach(x=>need[x.id]=(need[x.id]||0)+x.g*faltas[ix]);
    const lack=Object.entries(need).filter(([id,g])=>byId(S.filamentos,id).resta<g).map(([id,g])=>`${byId(S.filamentos,id).color}: faltan ${g-byId(S.filamentos,id).resta} g`);
    return `<div class="note" style="background:#fbecd8">Faltan ${faltas[ix]} u. de «${esc(p.nombre)}» para producir.${p.fil.length?(lack.length?' No alcanza el filamento → '+lack.join(', '):' El filamento alcanza.'):''}</div>`}).join('');
  openModal(`<h2>Nuevo pedido</h2><div class="form">
    <div><label>Cliente / referencia</label><input id="pc" value="${esc(cv.c)}"></div>
    <div><label>Canal de venta</label><select id="pca" onchange="pedModal({c:$('#pc').value,ca:this.value})">${S.canales.map(c=>`<option value="${c.id}" ${c.id===cv.ca?'selected':''}>${c.nombre}</option>`).join('')}</select></div></div>
    <div style="margin-top:14px"><label>Productos</label>
    ${draft.map((l,ix)=>`<div class="line"><select onchange="draft[${ix}].p=+this.value;pedModal({c:$('#pc').value,ca:$('#pca').value})">${S.productos.map(p=>`<option value="${p.id}" ${p.id===l.p?'selected':''}>${esc(p.nombre)} (${p.stock} listos)</option>`).join('')}</select>
      <input type="number" min="1" value="${l.q}" onchange="draft[${ix}].q=Math.max(1,+this.value);pedModal({c:$('#pc').value,ca:$('#pca').value})"><button class="qty" style="border:0;background:none;color:var(--danger);font-size:18px" onclick="draft.splice(${ix},1);if(!draft.length)draft.push({p:S.productos[0].id,q:1});pedModal({c:$('#pc').value,ca:$('#pca').value})">×</button></div>`).join('')}
    <button class="btn ghost sm" onclick="draft.push({p:S.productos[0].id,q:1});pedModal({c:$('#pc').value,ca:$('#pca').value})">+ otro producto</button></div>
    ${aviso}
    <div style="margin-top:12px"><b>Total: ${money(draft.reduce((a,l)=>a+l.q*(byId(S.productos,l.p).precios[cv.ca]||0),0))}</b></div>
    <div class="acts"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="savePed()">Guardar pedido</button></div>`);
}
function savePed(){
  const ca=$('#pca').value;let faltan=0;
  draft.forEach(l=>{const p=byId(S.productos,l.p);const usa=Math.min(p.stock,l.q);p.stock-=usa;faltan+=l.q-usa});
  S.pedidos.push({id:Date.now(),fecha:new Date().toISOString().slice(0,10),cliente:$('#pc').value||'Sin nombre',canal:ca,items:draft.map(l=>({p:l.p,q:l.q})),estado:faltan?'Pendiente':'Preparando',faltan:faltan||0});
  closeModal();S.view='pedidos';render();
}

/* ---------- Precios y canales ---------- */
function vPrecios(){
  $('#main').innerHTML=`<div class="top"><h1>Precios y canales</h1></div>
  <div class="note">Las comisiones de ejemplo hay que ajustarlas a lo que realmente te cobra cada canal. El margen es lo que te queda después de comisión, cargo fijo y costo.</div>
  <div class="grid two" style="margin-bottom:16px">
    <div class="card"><h3 style="margin-bottom:10px">Canales</h3>
      <table><thead><tr><th>Canal</th><th class="r">Comisión %</th><th class="r">Cargo fijo $</th></tr></thead><tbody>
      ${S.canales.map(c=>`<tr><td>${c.nombre}</td><td class="r"><input class="n" type="number" step="0.1" value="${c.com}" onchange="canal('${c.id}').com=+this.value;vPrecios()"></td><td class="r"><input class="n" type="number" value="${c.fijo}" onchange="canal('${c.id}').fijo=+this.value;vPrecios()"></td></tr>`).join('')}
      </tbody></table></div>
    <div class="card"><h3 style="margin-bottom:10px">Parámetros</h3><div class="form">
      <div><label>Costo por hora de impresión ($)</label><input type="number" value="${S.config.costoHora}" onchange="S.config.costoHora=+this.value;vPrecios()"></div>
      <div><label>Margen objetivo (%)</label><input type="number" value="${S.config.margenObjetivo}" onchange="S.config.margenObjetivo=+this.value;vPrecios()"></div></div></div>
  </div>
  ${S.canales.map(c=>`<div class="card tw" style="margin-bottom:14px"><h3 style="margin-bottom:8px">${c.nombre}</h3>
    <table><thead><tr><th>Producto</th><th class="r">Costo</th><th class="r">Precio de venta</th><th class="r">Te queda</th><th class="r">Margen</th><th class="r">Sugerido</th></tr></thead><tbody>
    ${S.productos.map(p=>{const pr=p.precios[c.id]||0;const co=costo(p);const n=neto(p,c,pr)-co;const m=pr?n/pr*100:0;const sg=sugerido(p,c);
      return `<tr><td>${esc(p.nombre)}</td><td class="r">${money(co)}</td>
      <td class="r"><input class="n" type="number" value="${pr}" onchange="byId(S.productos,${p.id}).precios['${c.id}']=+this.value;vPrecios()"></td>
      <td class="r ${n>=0?'pos':'neg'}">${pr?money(n):'—'}</td>
      <td class="r"><span class="tag ${m>=S.config.margenObjetivo?'ok':m>=20?'warn':'bad'}">${pr?m.toFixed(0)+'%':'—'}</span></td>
      <td class="r"><button class="btn ghost sm" onclick="byId(S.productos,${p.id}).precios['${c.id}']=Math.round(${sg}/100)*100;vPrecios()">${money(Math.round(sg/100)*100)}</button></td></tr>`}).join('')}
    </tbody></table></div>`).join('')}`;
}

S.view=(location.hash||'#panel').slice(1);if(!VIEWS.some(v=>v[0]===S.view))S.view='panel';
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h)&&h!==S.view){S.view=h;render()}});
render();
</script>
</body>
</html>
