<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIA · Esencia Hogar — Gestión</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%236e6043%27/%3E%3Ctext%20x%3D%2732%27%20y%3D%2746%27%20font-size%3D%2740%27%20font-family%3D%27Arial%2CHelvetica%2Csans-serif%27%20font-weight%3D%27700%27%20text-anchor%3D%27middle%27%20fill%3D%27%23efe9dc%27%3EP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Niramit:wght@400;500;600;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#6e6043; --primary-dark:#4f442f; --primary-soft:#efe9dc;
  --gray:#9b9a9a; --ink:#3b3426; --bg:#faf8f3; --card:#ffffff; --line:#e8e2d4;
  --ok:#4bb98c; --danger:#dd7774; --warn:#dc8f38; --info:#71b5dc; --cactus:#3f7d4e;
  --hf:"Niramit",sans-serif; --bf:"Rubik",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--bf);font-size:15px}
h1,h2,h3{font-family:var(--hf);margin:0;font-weight:600;color:var(--primary-dark)}
button{font-family:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:#fff;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{padding:4px 10px 18px}
.brand .pia{font-family:var(--hf);font-size:34px;font-weight:700;letter-spacing:.12em;color:var(--primary);line-height:1}
.brand .sub{font-family:var(--hf);font-size:11px;letter-spacing:.32em;color:var(--gray);text-transform:uppercase;margin-top:4px}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;color:var(--gray);font-size:15px}
nav button svg{width:20px;height:20px;flex:none}
nav button:hover{background:var(--primary-soft);color:var(--primary)}
nav button.on{background:var(--primary);color:#fff}
.links{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.links .lt{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gray);padding:0 12px 2px}
.links a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--gray);font-size:15px;text-decoration:none}
.links a svg{width:20px;height:20px;flex:none}
.links a:hover{background:var(--primary-soft);color:var(--primary)}
.foot{margin-top:auto;font-size:12px;color:var(--gray);padding:10px}
main{padding:28px 32px 60px;max-width:1150px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font-size:28px}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--primary-soft);color:var(--primary);font-weight:500;white-space:nowrap}
.tag.ok{background:#e1f4ec;color:#2d8a66}.tag.bad{background:#fbe6e5;color:#b84a47}.tag.warn{background:#fbecd8;color:#a8661a}.tag.info{background:#e3f1f9;color:#3b86ad}
.btn{background:var(--primary);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:500}
.btn:hover{background:var(--primary-dark)}
.btn.ghost{background:#fff;color:var(--primary);border:1px solid var(--primary)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kpi .l{font-size:12px;color:var(--gray);text-transform:uppercase;letter-spacing:.08em}
.kpi .v{font-family:var(--hf);font-size:28px;font-weight:600;color:var(--primary-dark);margin-top:4px}
.kpi .s{font-size:12px;color:var(--gray);margin-top:2px}
.two{grid-template-columns:1fr 1fr}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:99px;color:var(--gray)}
.tabs button.on{background:var(--primary);border-color:var(--primary);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--gray);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.r{text-align:right}
.tw{overflow-x:auto}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15);vertical-align:-2px;margin-right:6px}
.bar{height:7px;background:var(--primary-soft);border-radius:9px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--primary)}
.bar.low i{background:var(--danger)}
.qty{display:inline-flex;align-items:center;gap:6px}
.qty button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--primary);font-size:16px;line-height:1}
input,select{font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus{outline:2px solid var(--primary-soft);border-color:var(--primary)}
input.n{width:92px;text-align:right}
label{font-size:12px;color:var(--gray);display:block;margin-bottom:3px}
.form{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.form .full{grid-column:1/-1}
.modal{position:fixed;inset:0;background:rgba(59,52,38,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:560px;max-height:90vh;overflow:auto}
.modal h2{margin-bottom:14px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.muted{color:var(--gray);font-size:13px}
.alert{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.alert:last-child{border:0}
.line{display:grid;grid-template-columns:1fr 80px 30px;gap:8px;margin-bottom:8px;align-items:center}
.note{background:var(--primary-soft);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--primary-dark);margin-bottom:14px}
.pos{color:#2d8a66;font-weight:500}.neg{color:#b84a47;font-weight:500}
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;padding:6px;border-right:0;border-top:1px solid var(--line);z-index:10;justify-content:space-around}
  .brand,.foot{display:none}
  nav{display:flex;flex:1;min-width:0;justify-content:space-around}
  .links{margin:0;padding:0 0 0 4px;border-top:0;border-left:1px solid var(--line);flex-direction:row;gap:0;align-items:center}
  .links .lt,.links a span{display:none}
  .links a{padding:8px 10px;border-radius:10px}
  nav button{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;text-align:center;justify-content:center;width:auto}
  main{padding:18px 14px 90px}
  .two{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
}

.rm{border:0;background:none;color:var(--danger);font-size:20px;line-height:1;padding:0 4px}
#login{min-height:100vh;display:none;align-items:center;justify-content:center;padding:20px}
#login .card{width:100%;max-width:380px;padding:30px 26px;text-align:center}
#login .pia{font-family:var(--hf);font-size:46px;font-weight:700;letter-spacing:.14em;color:var(--primary);line-height:1}
#login .sub{font-family:var(--hf);font-size:12px;letter-spacing:.34em;color:var(--gray);text-transform:uppercase;margin:6px 0 24px}
#login input{margin-bottom:10px;text-align:left}
#login .btn{width:100%;padding:11px}
#lerr{color:#b84a47;font-size:13px;min-height:18px;margin-top:10px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--primary-dark);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:92vw}
#toast.on{opacity:1}
.foot button{margin-top:8px}
#out{display:none;position:fixed;top:10px;right:12px;z-index:9}
@media(max-width:820px){#out{display:block}}
.qn{width:84px;text-align:center;padding:5px 6px}
.tagc{border:1px solid var(--line);background:#fff;color:var(--gray);border-radius:99px;padding:3px 11px;font-size:12px;cursor:pointer;font-family:inherit}
.tagc.on{background:var(--primary);border-color:var(--primary);color:#fff}
/* Selector con buscador (productos, filamentos, insumos) */
.pk{position:relative;min-width:0}
.pk select{display:none}
.pkb{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
.pkb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pkb i{font-style:normal;color:var(--gray);flex:none}
.pk.open .pkb{border-color:var(--primary);outline:2px solid var(--primary-soft)}
.pkp{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(59,52,38,.18);z-index:25;padding:8px;min-width:220px}
.pk.open .pkp{display:block}
.pkl{max-height:220px;overflow:auto;margin-top:6px}
.pki{padding:7px 8px;border-radius:7px;cursor:pointer;font-size:14px}
.pki:hover,.pki.hl{background:var(--primary-soft)}
.pki.on{font-weight:600;color:var(--primary)}
.pkn{padding:8px;color:var(--gray);font-size:13px}
</style>
</head>
<body>
<div id="login">
  <div class="card">
    <div class="pia">PIA</div><div class="sub">Esencia Hogar</div>
    <input id="le" type="email" placeholder="Correo" autocomplete="username">
    <input id="lp" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button class="btn" id="lb" onclick="entrar()">Ingresar</button>
    <div id="lerr"></div>
  </div>
</div>
<div class="app" id="app" style="display:none">
  <aside>
    <div class="brand"><div class="pia">PIA</div><div class="sub">Esencia Hogar</div></div>
    <nav id="nav"></nav>
    <div class="links">
      <div class="lt">Mis tiendas</div>
      <a href="https://www.instagram.com/esencia.hogar.pia/" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none"/></svg><span>Instagram</span></a>
      <a href="https://esenciahogarpia.mitiendanube.com/" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg><span>Tienda Nube</span></a>
    </div>
    <div class="foot"><span id="who"></span><br><button class="btn ghost sm" onclick="salir()">Salir</button></div>
  </aside>
  <main id="main"></main>
</div>
<button class="btn ghost sm" id="out" onclick="salir()">Salir</button>
<div class="modal" id="modal"><div class="box" id="box"></div></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
/* ---------- Conexión a Supabase ----------
   La "publishable key" es pública por diseño: lo que protege los datos son las reglas
   de acceso (RLS) de la base, que solo dejan entrar a los correos autorizados. */
const SUPABASE_URL='https://omsqeklrbstoirljrhjb.supabase.co';
const SUPABASE_KEY='sb_publishable_vzXjLm2Y152Gk2F1rjMD-Q_AJVKVd_m';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const S={config:{costoHora:350,margenObjetivo:40,packaging:0},canales:[],filamentos:[],insumos:[],productos:[],pedidos:[],
  tabStock:'filamentos',tabProd:'todas',view:'panel',email:'',q:'',tagsSel:[],stockF:'todos',group:'ninguno',aq:'',aLinea:'todas',aStock:'todos',aTags:[],sq:'',pq:'',pEstado:'todos',pCanal:'todos',prq:''};
const STOCK_INICIAL=10; // unidades listas con las que arranca todo producto o variante nuevo
const ESTADOS=['Pendiente','Preparando','Enviado','Entregado'];
const $=s=>document.querySelector(s);
const money=n=>'$ '+Math.round(n).toLocaleString('es-AR');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=(arr,id)=>arr.find(x=>x.id==id);
const canal=id=>S.canales.find(c=>c.id===id);

/* ---------- Acceso a datos ---------- */
async function ok(p){const r=await p;if(r.error)throw new Error(r.error.message);return r.data}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),4500)}
async function act(fn){
  try{await fn();await load();render()}
  catch(e){
    const m=/foreign key|violates/i.test(e.message)?'Está en uso en un producto: sacalo primero de la receta.':e.message;
    toast('No se pudo guardar: '+m);
  }
}
async function load(){
  const q=t=>ok(sb.from(t).select('*'));
  const [cfg,can,fil,ins,pro,pf,pi,pr,ped,pit,cco]=await Promise.all(
    ['config','canales','filamentos','insumos','productos','producto_filamentos','producto_insumos','precios','pedidos','pedido_items','combo_componentes'].map(q));
  if(cfg[0])S.config={costoHora:+cfg[0].costo_hora,margenObjetivo:+cfg[0].margen_objetivo,packaging:+cfg[0].packaging||0};
  S.canales=can.map(c=>({id:c.id,nombre:c.nombre,com:+c.comision,fijo:+c.fijo}));
  S.filamentos=fil.map(f=>({id:f.id,marca:f.marca,material:f.material,color:f.color,hex:f.hex,costoKg:+f.costo_kg,rollo:+f.rollo,resta:+f.resta})).sort((a,b)=>a.id-b.id);
  S.insumos=ins.map(i=>({id:i.id,nombre:i.nombre,cat:i.cat,un:i.un,cant:+i.cant,min:+i.min,costo:+i.costo})).sort((a,b)=>a.id-b.id);
  S.productos=pro.map(p=>({id:p.id,nombre:p.nombre,linea:p.linea,horas:+p.horas,directo:+p.directo,stock:p.stock,activo:p.activo!==false,variante:p.variante||'',tags:p.tags||[],esCombo:!!p.es_combo,
    comps:cco.filter(x=>x.combo_id===p.id).map(x=>({p:x.producto_id,q:x.q})),
    fil:pf.filter(x=>x.producto_id===p.id).map(x=>({id:x.filamento_id,g:+x.g})),
    ins:pi.filter(x=>x.producto_id===p.id).map(x=>({id:x.insumo_id,q:+x.q})),
    precios:Object.fromEntries(pr.filter(x=>x.producto_id===p.id).map(x=>[x.canal_id,+x.precio]))})).sort((a,b)=>a.id-b.id);
  S.pedidos=ped.map(o=>({id:o.id,fecha:o.fecha,cliente:o.cliente,canal:o.canal_id,estado:o.estado,faltan:o.faltan,
    com:o.comision==null?null:+o.comision,fijo:o.fijo==null?null:+o.fijo,packaging:+o.packaging||0,
    items:pit.filter(x=>x.pedido_id===o.id).map(x=>({p:x.producto_id,q:x.q,
      precio:x.precio_unit==null?null:+x.precio_unit,costo:x.costo_unit==null?null:+x.costo_unit,de:x.de_stock||0}))})).sort((a,b)=>a.id-b.id);
}
const activos=()=>S.productos.filter(p=>p.activo);
const nom=p=>p?p.nombre+(p.variante?' · '+p.variante:''):'?';

/* ---------- Cálculos ---------- */
/* Un combo no tiene stock propio: alcanza para tantas unidades como permita su componente más escaso. */
function stockEff(p,extra){
  if(!p.esCombo)return p.stock;
  if(!p.comps.length)return 0;
  return Math.min(...p.comps.map(c=>{const x=byId(S.productos,c.p);return x?Math.floor(((x.stock||0)+((extra&&extra[c.p])||0))/c.q):0}))}
const sepPrecio=(p,cid)=>p.comps.reduce((a,c)=>a+c.q*((byId(S.productos,c.p)?.precios[cid])||0),0);
function costo(p){
  if(p.esCombo)return p.comps.reduce((a,c)=>{const x=byId(S.productos,c.p);return a+(x?c.q*costo(x):0)},0)+p.directo;
  const f=p.fil.reduce((a,x)=>a+x.g*(byId(S.filamentos,x.id)?.costoKg||0)/1000,0);
  const i=p.ins.reduce((a,x)=>a+x.q*(byId(S.insumos,x.id)?.costo||0),0);
  return f+i+p.horas*S.config.costoHora+p.directo;
}
function neto(c,precio){return precio*(1-c.com/100)-c.fijo}
function sugerido(p,c){const m=S.config.margenObjetivo/100;return (costo(p)+c.fijo)/(1-c.com/100-m)}
/* Cada pedido guarda el precio, el costo y la comisión del momento de la venta:
   cambiar precios o costos después no altera el historial. */
const precioItem=(o,i)=>i.precio!=null?i.precio:((byId(S.productos,i.p)?.precios[o.canal])||0);
const costoItem=i=>i.costo!=null?i.costo:(byId(S.productos,i.p)?costo(byId(S.productos,i.p)):0);
function totalPedido(o){return o.items.reduce((a,i)=>a+i.q*precioItem(o,i),0)}
function gananciaPedido(o){
  const c=canal(o.canal);const com=o.com!=null?o.com:(c?c.com:0),fijo=o.fijo!=null?o.fijo:(c?c.fijo:0);
  return o.items.reduce((a,i)=>a+i.q*(precioItem(o,i)*(1-com/100)-fijo-costoItem(i)),0)-(o.packaging||0)}
function alertas(){
  const a=[];
  S.filamentos.forEach(f=>{if(f.resta<f.rollo*0.2)a.push({t:`${f.material} ${f.color}`,d:`quedan ${f.resta} g`})});
  S.insumos.forEach(i=>{if(i.cant<i.min)a.push({t:i.nombre,d:`${i.cant} ${i.un} (mín. ${i.min})`})});
  return a;
}

/* ---------- Navegación ---------- */
const ICON={
  panel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  stock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>',
  productos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 21h10M12 21v-6M5 4h14l-1.5 8a5.5 5.5 0 01-11 0z"/></svg>',
  pedidos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2h12l2 5v14H4V7z"/><path d="M4 7h16M9 11h6"/></svg>',
  precios:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.3"/></svg>'
};
const VIEWS=[['panel','Panel'],['stock','Stock'],['productos','Productos'],['pedidos','Pedidos'],['precios','Precios']];
function drawNav(){$('#nav').innerHTML=VIEWS.map(([k,n])=>`<button class="${S.view===k?'on':''}" onclick="go('${k}')">${ICON[k]}<span>${n}</span></button>`).join('')}
function go(v){S.view=v;location.hash=v;render()}
function render(){drawNav();$('#who').textContent=S.email;({panel:vPanel,stock:vStock,productos:vProductos,pedidos:vPedidos,precios:vPrecios})[S.view]();window.scrollTo(0,0)}
const vacio=t=>`<div class="muted" style="padding:14px 4px">${t}</div>`;

/* ---------- Panel ---------- */
function vPanel(){
  const vivos=S.pedidos.filter(o=>o.estado!=='Cancelado');
  const ventas=vivos.reduce((a,o)=>a+totalPedido(o),0);
  const gan=vivos.reduce((a,o)=>a+gananciaPedido(o),0);
  const pend=vivos.filter(o=>o.estado!=='Entregado').length;

      <td class="r" style="white-space:nowrap"><button class="btn ghost sm" onclick="editFil(${f.id})">Editar</button> <button class="btn ghost sm" onclick="askDel('filamentos',${f.id})" title="Eliminar">🗑</button></td></tr>`}).join('')}</tbody></table></div>`;
  }else if(t==='insumos'){

      <td class="r">${money(i.costo)}/${esc(i.un)}</td><td class="r" style="white-space:nowrap"><span class="muted">mín. ${i.min}</span> <button class="btn ghost sm" onclick="editIns(${i.id})">Editar</button> <button class="btn ghost sm" onclick="askDel('insumos',${i.id})" title="Eliminar">🗑</button></td></tr>`).join('')}</tbody></table></div>`;
  }else{
    const vis=activos().filter(p=>hit(nom(p)+' '+p.linea+' '+p.tags.join(' '))),simples=vis.filter(p=>!p.esCombo),combos=vis.filter(p=>p.esCombo);

/* ---------- Selector con buscador ----------
   Un <select> oculto guarda el valor (así el resto del código lo lee igual que antes) y encima va un botón
   que abre una lista ordenada de la A a la Z con un cuadro de búsqueda. items: [{v,t,s}] (valor, texto, detalle). */
const sinTildes=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function picker(items,cur,attrs=''){
  const L=[...items].sort((a,b)=>a.t.localeCompare(b.t,'es',{sensitivity:'base',numeric:true}));
  const sel=L.find(x=>x.v==cur)||L[0];
  return `<div class="pk"><select ${attrs}>${L.map(x=>`<option value="${x.v}" ${sel&&x.v==sel.v?'selected':''}>${esc(x.t)}</option>`).join('')}</select>
    <button type="button" class="pkb" onclick="pkAbrir(this)"><span>${esc(sel?sel.t+(sel.s?' · '+sel.s:''):'—')}</span><i>▾</i></button>
    <div class="pkp"><input class="pkq" placeholder="Buscar..." autocomplete="off" oninput="pkFiltrar(this)" onkeydown="pkTecla(event,this)">
    <div class="pkl">${L.map(x=>`<div class="pki${sel&&x.v==sel.v?' on':''}" data-v="${x.v}" data-k="${esc(sinTildes(x.t))}" onclick="pkElegir(this)">${esc(x.t)}${x.s?` <span class="muted">· ${esc(x.s)}</span>`:''}</div>`).join('')}<div class="pkn" style="display:none">Nada coincide.</div></div></div></div>`}
function pkCerrar(){document.querySelectorAll('.pk.open').forEach(p=>p.classList.remove('open'))}
function pkAbrir(btn){
  const pk=btn.closest('.pk'),abrir=!pk.classList.contains('open');pkCerrar();if(!abrir)return;
  pk.classList.add('open');const q=pk.querySelector('.pkq');q.value='';pkFiltrar(q);
  q.focus();pk.querySelector('.pkp').scrollIntoView({block:'nearest'});
  const on=pk.querySelector('.pki.on');if(on)on.scrollIntoView({block:'nearest'});
}
function pkFiltrar(inp){
  const pk=inp.closest('.pk'),q=sinTildes(inp.value.trim());let n=0;
  pk.querySelectorAll('.pki').forEach(i=>{const ver=!q||i.dataset.k.includes(q);i.style.display=ver?'':'none';i.classList.remove('hl');if(ver&&!n++)i.classList.add('hl')});
  pk.querySelector('.pkn').style.display=n?'none':'';
}
function pkTecla(e,inp){
  const pk=inp.closest('.pk');
  if(e.key==='Escape'){e.preventDefault();e.stopPropagation();pk.classList.remove('open');pk.querySelector('.pkb').focus();return}
  const vis=[...pk.querySelectorAll('.pki')].filter(i=>i.style.display!=='none'),cur=vis.findIndex(i=>i.classList.contains('hl'));
  if(e.key==='Enter'){e.preventDefault();if(vis[Math.max(cur,0)])pkElegir(vis[Math.max(cur,0)]);return}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!vis.length)return;
    const nx=vis[(cur+(e.key==='ArrowDown'?1:-1)+vis.length)%vis.length];vis.forEach(i=>i.classList.remove('hl'));nx.classList.add('hl');nx.scrollIntoView({block:'nearest'})}
}
function pkElegir(item){
  const pk=item.closest('.pk'),sel=pk.querySelector('select'),cambio=sel.value!==item.dataset.v;
  pk.classList.remove('open');
  if(!cambio)return;
  sel.value=item.dataset.v;
  pk.querySelector('.pkb span').textContent=item.textContent;
  if(sel.onchange)sel.onchange.call(sel);   // el modal se redibuja con la nueva elección
}

const normTag=t=>t.toLowerCase().replace(/[^\p{L}\p{N} _-]/gu,'').replace(/\s+/g,' ').trim().slice(0,24);
const hayFiltros=()=>!!(S.q.trim()||S.tagsSel.length||S.stockF!=='todos'||S.tabProd!=='todas');
function limpiarFiltros(){S.q='';S.tagsSel=[];S.stockF='todos';S.tabProd='todas';render()}
function filtroTagIdx(i){const t=S._tagsUso[i];S.tagsSel=S.tagsSel.includes(t)?S.tagsSel.filter(x=>x!==t):[...S.tagsSel,t];render()}
function filtroTag(t){if(!S.tagsSel.includes(t))S.tagsSel=[...S.tagsSel,t];render()}
function filtrar(){
  const q=S.q.trim().toLowerCase();
  return activos().filter(p=>{
    if(S.tabProd!=='todas'&&p.linea!==S.tabProd)return false;
    if(S.tagsSel.some(t=>!p.tags.includes(t)))return false;
    if(S.stockF==='con'&&stockEff(p)<=0)return false;
    if(S.stockF==='sin'&&stockEff(p)>0)return false;
    if(S.stockF==='poco'&&stockEff(p)>=3)return false;
    if(q&&!(nom(p)+' '+p.linea+' '+p.tags.join(' ')).toLowerCase().includes(q))return false;
    return true});
}

const hayFiltrosArch=()=>!!(S.aq.trim()||S.aLinea!=='todas'||S.aStock!=='todos'||S.aTags.length);
function limpiarArch(){S.aq='';S.aLinea='todas';S.aStock='todos';S.aTags=[];render()}
function archTagIdx(i){const t=S._aTagsUso[i];S.aTags=S.aTags.includes(t)?S.aTags.filter(x=>x!==t):[...S.aTags,t];render()}
function filtrarArch(){
  const q=S.aq.trim().toLowerCase();
  return S.productos.filter(p=>{
    if(p.activo)return false;
    if(S.aLinea!=='todas'&&p.linea!==S.aLinea)return false;
    if(S.aTags.some(t=>!p.tags.includes(t)))return false;
    if(S.aStock==='con'&&stockEff(p)<=0)return false;
    if(S.aStock==='sin'&&stockEff(p)>0)return false;
    if(q&&!(nom(p)+' '+p.linea+' '+p.tags.join(' ')).toLowerCase().includes(q))return false;
    return true}).sort((a,b)=>nom(a).localeCompare(nom(b),'es'));
}
function drawArch(){
  const list=filtrarArch(),total=S.productos.filter(p=>!p.activo).length;

  act(()=>ok(sb.from('productos').update({activo:true}).eq('id',id)))}

/* Guardar (crear o editar) va por una función de la base que reemplaza la receta de una sola vez. */
function addProd(){
  readProd();const v=dp.v;const nombre=v.nombre.trim(),variante=(v.variante||'').trim();
  if(!nombre)return toast('Poné el nombre del producto.');
  /* Solo se controla nombre + variante al crear, o si se cambiaron: así se pueden editar tags, receta, etc.
     de productos que ya existían sin variante. */
  const orig=dp.id?byId(S.productos,dp.id):null;
  const cambioId=!orig||orig.nombre.trim().toLowerCase()!==nombre.toLowerCase()||(orig.variante||'').trim().toLowerCase()!==variante.toLowerCase();
  if(cambioId){
    const hermanos=S.productos.filter(x=>x.activo&&x.id!==dp.id&&x.nombre.trim().toLowerCase()===nombre.toLowerCase());
    if(hermanos.length&&!variante)return toast('Ya hay un producto con ese nombre: indicá la variante (color, tamaño...).');
    if(hermanos.some(x=>(x.variante||'').trim().toLowerCase()===variante.toLowerCase()))return toast('Ya existe esa variante de «'+nombre+'».');
  }
  const fil=dp.fil.filter(x=>x.g>0).map(x=>({id:x.id,g:x.g})),ins=dp.ins.filter(x=>x.q>0).map(x=>({id:x.id,q:x.q}));
  const args={p_id:dp.id,p_nombre:nombre,p_variante:variante,p_linea:v.linea,p_horas:parseFloat(v.horas)||0,p_directo:parseFloat(v.directo)||0,
    p_stock:Math.max(0,parseInt(v.stock)||0),p_fil:fil,p_ins:ins};
  const viejo=dp.id?byId(S.productos,dp.id).nombre:null,copia=dp.copia,tags=(dp.tags||[]).slice();
  closeModal();
  act(async()=>{
    const id=await ok(sb.rpc('guardar_producto',args));
    // Si se cambió el nombre, se renombran también las demás variantes de la familia.
    if(viejo&&viejo!==nombre)await ok(sb.from('productos').update({nombre}).eq('nombre',viejo));
    await ok(sb.from('productos').update({tags}).eq('nombre',nombre));   // los tags valen para toda la familia
    if(copia)await ok(sb.from('precios').upsert(Object.entries(copia).map(([c,p])=>({producto_id:id,canal_id:c,precio:p})),{onConflict:'producto_id,canal_id'}));
  });
}

  comboRead();const nombre=dc.nombre.trim(),variante=(dc.variante||'').trim();
  if(!nombre)return toast('Poné el nombre del combo.');
  if(!dc.comps.length)return toast('El combo necesita al menos un producto.');
  const mismo=x=>x.nombre.trim().toLowerCase()===nombre.toLowerCase();
  if(S.productos.some(x=>x.activo&&!x.esCombo&&mismo(x)))return toast('Ya hay un producto con ese nombre.');
  const hermanos=S.productos.filter(x=>x.activo&&x.esCombo&&x.id!==dc.id&&mismo(x));
  if(hermanos.length&&!variante)return toast('Ya hay un combo con ese nombre: indicá la variante (color, tamaño...).');
  if(hermanos.some(x=>(x.variante||'').trim().toLowerCase()===variante.toLowerCase()))return toast('Ya existe esa variante de «'+nombre+'».');
  const comps=Object.values(dc.comps.reduce((m,c)=>{m[c.p]=m[c.p]?{p:c.p,q:m[c.p].q+c.q}:{...c};return m},{}));
  const tags=dc.tags.slice(),id0=dc.id,precios={...dc.precios};
  closeModal();
  act(async()=>{
    const id=await ok(sb.rpc('guardar_combo',{p_id:id0,p_nombre:nombre,p_directo:dc.directo||0,p_comps:comps,p_variante:variante}));
    await ok(sb.from('productos').update({tags}).eq('nombre',nombre).eq('es_combo',true));   // los tags valen para toda la familia
    await ok(sb.from('precios').upsert(S.canales.map(c=>({producto_id:id,canal_id:c.id,precio:precios[c.id]||0})),{onConflict:'producto_id,canal_id'}));
  });
}

/* ---------- Pedidos ---------- */
const pedTexto=o=>(o.cliente+' '+(canal(o.canal)?.nombre||'')+' '+o.estado+' '+o.items.map(i=>nom(byId(S.productos,i.p))).join(' ')).toLowerCase();
const hayFiltrosPed=()=>!!(S.pq.trim()||S.pEstado!=='todos'||S.pCanal!=='todos');
function limpiarPed(){S.pq='';S.pEstado='todos';S.pCanal='todos';render()}
function drawPed(){
  const q=S.pq.trim().toLowerCase();
  const list=[...S.pedidos].reverse().filter(o=>(S.pEstado==='todos'||o.estado===S.pEstado)&&(S.pCanal==='todos'||o.canal===S.pCanal)&&(!q||pedTexto(o).includes(q)));
  $('#plist').innerHTML=`<div class="card tw">${!S.pedidos.length?vacio('Todavía no hay pedidos.'):!list.length?vacio('Ningún pedido coincide con los filtros.'):`<table><thead><tr><th>Fecha</th><th>Cliente</th><th>Canal</th><th>Productos</th><th class="r">Total</th><th class="r">Ganancia</th><th>Estado</th><th></th></tr></thead><tbody>
  ${list.map(o=>{const g=gananciaPedido(o);const x=o.estado==='Cancelado';return `<tr style="${x?'opacity:.55':''}"><td>${o.fecha.slice(5).split('-').reverse().join('/')}</td><td>${esc(o.cliente)}</td><td>${esc(canal(o.canal)?.nombre||'—')}</td>
    <td>${o.items.map(i=>`${i.q}× ${esc(nom(byId(S.productos,i.p)))}`).join('<br>')}${o.faltan?`<br><span class="tag warn">a producir: ${o.faltan}</span>`:''}${o.packaging?`<br><span class="muted">packaging ${money(o.packaging)}</span>`:''}</td>
    <td class="r" style="${x?'text-decoration:line-through':''}">${money(totalPedido(o))}${!x&&o.items.some(i=>!precioItem(o,i))?'<br><span class="tag warn">sin precio</span>':''}</td><td class="r ${x?'':g>=0?'pos':'neg'}">${x?'—':money(g)}</td>
    <td>${x?'<span class="tag bad">Cancelado</span>':`<button class="tag ${o.estado==='Entregado'?'ok':o.estado==='Enviado'?'info':o.estado==='Preparando'?'warn':''}" style="border:0;cursor:pointer" onclick="nextEstado(${o.id})" title="Click para avanzar">${o.estado} ›</button>`}</td>
    <td class="r" style="white-space:nowrap"><button class="btn ghost sm" onclick="clonarPed(${o.id})" title="Armar un pedido nuevo igual a este">Clonar</button> ${x?'':`<button class="btn ghost sm" onclick="editPed(${o.id})">Editar</button> <button class="btn ghost sm" onclick="askCancel(${o.id})">Cancelar</button>`}</td></tr>`}).join('')}
  </tbody></table>`}</div>`;
  const lc=$('#pclear');if(lc)lc.style.display=hayFiltrosPed()?'':'none';
}
function vPedidos(){
  const opt=(v,t,cur)=>`<option value="${v}" ${cur===v?'selected':''}>${t}</option>`;
  $('#main').innerHTML=`<div class="top"><h1>Pedidos</h1><button class="btn" onclick="newPed()">+ Pedido</button></div>
  <div class="card" style="margin-bottom:14px"><div class="form" style="grid-template-columns:2fr 1fr 1fr">
    <div><label>Buscar</label><input value="${esc(S.pq)}" placeholder="Cliente, producto o canal" oninput="S.pq=this.value;drawPed()"></div>
    <div><label>Estado</label><select onchange="S.pEstado=this.value;render()">${opt('todos','Todos',S.pEstado)}${[...ESTADOS,'Cancelado'].map(e=>opt(e,e,S.pEstado)).join('')}</select></div>
    <div><label>Canal</label><select onchange="S.pCanal=this.value;render()">${opt('todos','Todos',S.pCanal)}${S.canales.map(c=>opt(c.id,esc(c.nombre),S.pCanal)).join('')}</select></div></div>
    <button id="pclear" class="btn ghost sm" style="margin-top:10px;${hayFiltrosPed()?'':'display:none'}" onclick="limpiarPed()">Limpiar filtros</button></div>
  <div id="plist"></div>`;
  drawPed();
}
function nextEstado(id){const o=byId(S.pedidos,id);if(o.estado==='Cancelado')return;const e=ESTADOS[(ESTADOS.indexOf(o.estado)+1)%ESTADOS.length];act(()=>ok(sb.from('pedidos').update({estado:e}).eq('id',id)))}
/* Editar un pedido. Pendiente/Preparando: productos, cantidades y canal (el stock se reacomoda en la base).
   Enviado/Entregado: solo el cliente, porque el producto ya salió. Cancelado: no se edita. */
function editPed(id){const o=byId(S.pedidos,id);
  if(o.estado==='Cancelado')return toast('Un pedido cancelado no se puede editar.');
  if(o.estado==='Enviado'||o.estado==='Entregado'){
    openModal(`<h2>Editar pedido</h2><div class="form"><div class="full"><label>Cliente / referencia</label><input id="e1" value="${esc(o.cliente)}"></div><div class="full"><label>Packaging de este pedido ($)</label><input id="e2" type="number" min="0" value="${o.packaging||0}"></div></div>
    <p class="muted" style="margin-top:10px">Como el pedido ya figura como ${esc(o.estado.toLowerCase())}, solo se puede cambiar el cliente y el packaging. Si hubo un error en los productos, cancelalo (el stock no se devuelve) y cargá uno nuevo.</p>
    <div class="acts"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="savePedCliente(${id})">Guardar</button></div>`);return}
  draft=o.items.map(i=>({p:i.p,q:i.q}));pv={id,c:o.cliente,ca:o.canal,pk:o.packaging||0};pedModal()}
function savePedCliente(id){const c=$('#e1').value.trim()||'Sin nombre',pk=Math.max(0,parseFloat($('#e2').value)||0);closeModal();act(()=>ok(sb.from('pedidos').update({cliente:c,packaging:pk}).eq('id',id)))}
function askCancel(id){const o=byId(S.pedidos,id);const vuelve=o.estado==='Pendiente'||o.estado==='Preparando';
  openModal(`<h2>¿Cancelar el pedido de «${esc(o.cliente)}»?</h2>
  <p class="muted">${vuelve?'Las unidades que se habían descontado del stock vuelven a stock.':'Como ya figura como '+esc(o.estado.toLowerCase())+', el stock <b>no</b> se devuelve: si el producto volvió, sumalo a mano en Stock.'}
  El pedido queda en la lista como cancelado y deja de contar en ventas y ganancia. No se puede deshacer.</p>
  <div class="acts"><button class="btn ghost" onclick="closeModal()">Volver</button><button class="btn" style="background:#b84a47" onclick="doCancel(${id})">Sí, cancelar pedido</button></div>`)}
function doCancel(id){closeModal();act(()=>ok(sb.rpc('cancelar_pedido',{p_id:id})))}
let draft=[];let pv={c:'',ca:'',pk:0};
function newPed(){
  if(!activos().length)return toast('Primero creá al menos un producto.');
  if(!S.canales.length)return toast('No hay canales de venta cargados.');
  draft=[{p:activos()[0].id,q:1}];pv={id:null,c:'',ca:S.canales[S.canales.length-1].id,pk:S.config.packaging||0};pedModal()}
/* Clonar: abre un pedido nuevo con los mismos productos, cantidades, canal y packaging.
   El cliente queda vacío y los precios son los de hoy. Los productos archivados no se copian. */
function clonarPed(id){
  const o=byId(S.pedidos,id);if(!o)return;
  if(!S.canales.length)return toast('No hay canales de venta cargados.');
  const vivos=o.items.filter(i=>byId(S.productos,i.p)?.activo);
  if(!vivos.length)return toast('Ningún producto de ese pedido está disponible: todos están archivados.');
  const saltados=o.items.length-vivos.length;
  draft=vivos.map(i=>({p:i.p,q:i.q}));
  pv={id:null,c:'',ca:canal(o.canal)?o.canal:S.canales[S.canales.length-1].id,pk:o.packaging||0,copia:o.cliente};
  pedModal();
  if(saltados)toast(`${saltados} producto${saltados>1?'s':''} archivado${saltados>1?'s':''} no se copiaron.`);
}
function pedRead(){pv={...pv,c:$('#pc').value,ca:$('#pca').value,pk:Math.max(0,parseFloat($('#ppk').value)||0)}}
const origPed=()=>pv.id?byId(S.pedidos,pv.id):null;
/* Al editar, las unidades que este pedido ya tenía descontadas cuentan como disponibles. */
const deOrig=id=>(origPed()?.items.find(i=>i.p===id)?.de)||0;
const extraComps=p=>{const e={};const d=deOrig(p.id);if(d)p.comps.forEach(c=>e[c.p]=d*c.q);return e};
const disp=p=>p.esCombo?stockEff(p,extraComps(p)):p.stock+deOrig(p.id);
const opcionesProd=()=>{const o=origPed();const extra=o?o.items.map(i=>byId(S.productos,i.p)).filter(p=>p&&!p.activo):[];return [...activos(),...extra]};
const precioDraft=l=>{const o=origPed();const it=o&&pv.ca===o.canal?o.items.find(i=>i.p===l.p):null;return it&&it.precio!=null?it.precio:((byId(S.productos,l.p)?.precios[pv.ca])||0)};
function pedModal(){
  const faltas=draft.map(l=>Math.max(0,l.q-disp(byId(S.productos,l.p))));
  const aviso=draft.map((l,ix)=>{
    if(!faltas[ix])return '';
    const p=byId(S.productos,l.p);
    if(p.esCombo){const e=extraComps(p);const sh=p.comps.map(c=>{const x=byId(S.productos,c.p);const falta=c.q*l.q-((x.stock||0)+(e[c.p]||0));return falta>0?`${esc(nom(x))}: faltan ${falta}`:null}).filter(Boolean);
      return `<div class="note" style="background:#fbecd8">Faltan ${faltas[ix]} u. del combo «${esc(nom(p))}» para producir.${sh.length?' Te faltan → '+sh.join(', '):''}</div>`}
    const need={};p.fil.forEach(x=>need[x.id]=(need[x.id]||0)+x.g*faltas[ix]);
    const lack=Object.entries(need).filter(([id,g])=>byId(S.filamentos,id).resta<g).map(([id,g])=>`${esc(byId(S.filamentos,id).color)}: faltan ${g-byId(S.filamentos,id).resta} g`);
    return `<div class="note" style="background:#fbecd8">Faltan ${faltas[ix]} u. de «${esc(nom(p))}» para producir.${p.fil.length?(lack.length?' No alcanza el filamento → '+lack.join(', '):' El filamento alcanza.'):''}</div>`}).join('');
  const total=draft.reduce((a,l)=>a+l.q*precioDraft(l),0);
  const sinPrecio=[...new Set(draft.filter(l=>!precioDraft(l)).map(l=>nom(byId(S.productos,l.p))))];
  openModal(`<h2>${pv.id?'Editar pedido':'Nuevo pedido'}</h2>${pv.copia?`<p class="muted" style="margin:-6px 0 12px">Copia del pedido de «${esc(pv.copia)}»: mismos productos, cantidades y canal. Poné el cliente; los precios son los de hoy.</p>`:''}${pv.id?'<p class="muted" style="margin:-6px 0 12px">Al guardar, el stock se reacomoda. Los productos que ya estaban conservan su precio; si cambiás el canal, se recalcula todo con los precios actuales.</p>':''}<div class="form">
    <div><label>Cliente / referencia</label><input id="pc" value="${esc(pv.c)}"></div>
    <div><label>Canal de venta</label><select id="pca" onchange="pedRead();pedModal()">${S.canales.map(c=>`<option value="${c.id}" ${c.id===pv.ca?'selected':''}>${esc(c.nombre)}</option>`).join('')}</select></div>
    <div><label>Packaging de este pedido ($)</label><input id="ppk" type="number" min="0" value="${pv.pk||0}" onchange="pedRead();pedModal()"></div></div>
    <div style="margin-top:14px"><label>Productos</label>
    ${draft.map((l,ix)=>`<div class="line">${picker(opcionesProd().map(p=>({v:p.id,t:nom(p)+(p.activo?'':' (archivado)'),s:`${disp(p)} ${p.esCombo?'posibles':'listos'}`})),l.p,`onchange="pedRead();draft[${ix}].p=+this.value;pedModal()"`)}
      <input type="number" min="1" value="${l.q}" onchange="pedRead();draft[${ix}].q=Math.max(1,parseInt(this.value)||1);pedModal()"><button class="rm" onclick="pedRead();draft.splice(${ix},1);if(!draft.length)draft.push({p:activos()[0].id,q:1});pedModal()">×</button></div>`).join('')}
    <button class="btn ghost sm" onclick="pedRead();draft.push({p:activos()[0].id,q:1});pedModal()">+ otro producto</button></div>
    ${aviso}
    ${sinPrecio.length?`<div class="note" style="background:#fbecd8;margin-top:12px">Sin precio en ${esc(canal(pv.ca)?.nombre||'este canal')}: ${sinPrecio.map(esc).join(', ')}. Cargalo en Precios o el total y la ganancia van a salir en $0.</div>`:''}
    <div style="margin-top:12px"><b>Total: ${money(total)}</b>${pv.pk?` <span class="muted">· packaging ${money(pv.pk)} (costo, no se suma al total)</span>`:''}</div>
    ${pv.id?`<div style="margin-top:8px"><button class="btn ghost sm" onclick="actualizarPrecios()">Usar precios de hoy</button> <span class="muted">Pone en este pedido los precios y costos actuales (descarta los cambios sin guardar de esta ventana).</span></div>`:''}
    <div class="acts"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="savePed()">${pv.id?'Guardar cambios':'Guardar pedido'}</button></div>`);
}
/* Pedidos que todavía no salieron: reemplaza precio y costo guardados por los actuales (lo hace la base). */
function actualizarPrecios(){const id=pv.id;closeModal();act(()=>ok(sb.rpc('actualizar_precios_pedido',{p_id:id})).then(()=>toast('Pedido actualizado con los precios de hoy.')))}
function savePed(){
  pedRead();
  const merged=Object.values(draft.reduce((m,l)=>{m[l.p]=m[l.p]?{p:l.p,q:m[l.p].q+l.q}:{...l};return m},{}));
  closeModal();S.view='pedidos';
  const pk=pv.pk||0,id0=pv.id;
  act(async()=>{
    let id=id0;
    if(id0)await ok(sb.rpc('editar_pedido',{p_id:id0,p_cliente:pv.c,p_canal:pv.ca,p_items:merged}));
    else id=await ok(sb.rpc('crear_pedido',{p_cliente:pv.c,p_canal:pv.ca,p_items:merged}));
    await ok(sb.from('pedidos').update({packaging:pk}).eq('id',id));
  });
}

/* ---------- Precios y canales ---------- */
function setPrecio(pid,cid,val){act(()=>ok(sb.from('precios').upsert({producto_id:pid,canal_id:cid,precio:Math.max(0,parseFloat(val)||0)},{onConflict:'producto_id,canal_id'})))}
function setCanal(id,k,val){act(()=>ok(sb.from('canales').update({[k]:Math.max(0,parseFloat(val)||0)}).eq('id',id)))}
function setConf(k,val){act(()=>ok(sb.from('config').update({[k]:Math.max(0,parseFloat(val)||0)}).eq('id',1)))}
function vPrecios(){
  $('#main').innerHTML=`<div class="top"><h1>Precios y canales</h1></div>
  <div class="note">Revisá las comisiones de cada canal: tienen que ser las que realmente te cobran. «Te queda» descuenta comisión, cargo fijo y costo.</div>
  <div class="grid two" style="margin-bottom:16px">
    <div class="card"><h3 style="margin-bottom:10px">Canales</h3>
      <table><thead><tr><th>Canal</th><th class="r">Comisión %</th><th class="r">Cargo fijo $</th></tr></thead><tbody>
      ${S.canales.map(c=>`<tr><td>${esc(c.nombre)}</td><td class="r"><input class="n" type="number" step="0.1" value="${c.com}" onchange="setCanal('${c.id}','comision',this.value)"></td><td class="r"><input class="n" type="number" value="${c.fijo}" onchange="setCanal('${c.id}','fijo',this.value)"></td></tr>`).join('')}
      </tbody></table></div>
    <div class="card"><h3 style="margin-bottom:10px">Parámetros</h3><div class="form">
      <div><label>Costo por hora de impresión ($)</label><input type="number" value="${S.config.costoHora}" onchange="setConf('costo_hora',this.value)"></div>
      <div><label>Margen objetivo (%)</label><input type="number" value="${S.config.margenObjetivo}" onchange="setConf('margen_objetivo',this.value)"></div>
      <div class="full"><label>Packaging por pedido ($) · valor inicial de cada pedido nuevo, se puede cambiar en cada uno</label><input type="number" min="0" value="${S.config.packaging||0}" onchange="setConf('packaging',this.value)"></div></div></div>
  </div>
  ${activos().length?`<div class="card" style="margin-bottom:14px"><label>Buscar producto</label><input value="${esc(S.prq)}" placeholder="Nombre, variante o línea" oninput="S.prq=this.value;drawPrecios()"></div>`:''}
  <div id="prlist"></div>`;
  drawPrecios();
}
function drawPrecios(){
  const q=S.prq.trim().toLowerCase();const lista=activos().filter(p=>!q||(nom(p)+' '+p.linea+' '+p.tags.join(' ')).toLowerCase().includes(q));
  $('#prlist').innerHTML=`${!activos().length?'<div class="card">'+vacio('Creá productos para poder ponerles precio.')+'</div>':!lista.length?'<div class="card">'+vacio('Ningún producto coincide con la búsqueda.')+'</div>':''}
  ${lista.length?S.canales.map(c=>`<div class="card tw" style="margin-bottom:14px"><h3 style="margin-bottom:8px">${esc(c.nombre)}</h3>
    <table><thead><tr><th>Producto</th><th class="r">Costo</th><th class="r">Precio de venta</th><th class="r">Te queda</th><th class="r">Margen</th><th class="r">Sugerido</th></tr></thead><tbody>
    ${lista.map(p=>{const pr=p.precios[c.id]||0;const co=costo(p);const n=neto(c,pr)-co;const m=pr?n/pr*100:0;const sg=Math.round(sugerido(p,c)/100)*100;
      return `<tr><td>${esc(nom(p))}${p.esCombo?`<div class="muted">por separado: ${money(sepPrecio(p,c.id))}${pr&&sepPrecio(p,c.id)?` · descuento ${Math.round((1-pr/sepPrecio(p,c.id))*100)}%`:''}</div>`:''}</td><td class="r">${money(co)}</td>
      <td class="r"><input class="n" type="number" value="${pr}" onchange="setPrecio(${p.id},'${c.id}',this.value)"></td>
      <td class="r ${n>=0?'pos':'neg'}">${pr?money(n):'—'}</td>
      <td class="r"><span class="tag ${m>=S.config.margenObjetivo?'ok':m>=20?'warn':'bad'}">${pr?m.toFixed(0)+'%':'—'}</span></td>
      <td class="r"><button class="btn ghost sm" onclick="setPrecio(${p.id},'${c.id}',${sg})">${money(sg)}</button></td></tr>`}).join('')}
    </tbody></table></div>`).join(''):''}`;
}

/* ---------- Exportar a Excel ----------
   Baja un .xlsx con una hoja por tema, con los datos tal como están ahora en pantalla (respaldo). */
function exportarExcel(){
  if(typeof XLSX==='undefined')return toast('No se pudo cargar el exportador de Excel. Revisá la conexión y recargá la página.');
  const wb=XLSX.utils.book_new();
  const add=(nombre,rows)=>{if(rows.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),nombre)};
  add('Productos',S.productos.slice().sort((a,b)=>nom(a).localeCompare(nom(b),'es')).map(p=>{
    const f={Producto:p.nombre,Variante:p.variante,Línea:p.linea,Tipo:p.esCombo?'Combo':'Producto',Estado:p.activo?'Activo':'Archivado',
      'Unidades listas':stockEff(p),Costo:Math.round(costo(p)),Tags:p.tags.join(', ')};
    if(p.esCombo)f.Componentes=p.comps.map(c=>c.q+'× '+nom(byId(S.productos,c.p))).join(' + ');
    S.canales.forEach(c=>{const pr=p.precios[c.id]||0;f['Precio '+c.nombre]=pr;f['Margen % '+c.nombre]=pr?Math.round((neto(c,pr)-costo(p))/pr*100):''});
    return f}));
  add('Pedidos',S.pedidos.map(o=>({Número:o.id,Fecha:o.fecha,Cliente:o.cliente,Canal:canal(o.canal)?.nombre||'',Estado:o.estado,
    'A producir':o.faltan||0,Total:Math.round(totalPedido(o)),Packaging:o.packaging||0,'Ganancia':o.estado==='Cancelado'?0:Math.round(gananciaPedido(o))})));
  add('Detalle de pedidos',S.pedidos.flatMap(o=>o.items.map(i=>({Pedido:o.id,Fecha:o.fecha,Cliente:o.cliente,Canal:canal(o.canal)?.nombre||'',Estado:o.estado,
    Producto:nom(byId(S.productos,i.p)),Cantidad:i.q,'Precio unitario':Math.round(precioItem(o,i)),'Costo unitario':Math.round(costoItem(i)),
    Subtotal:Math.round(i.q*precioItem(o,i))}))));
  add('Filamentos',S.filamentos.map(f=>({Marca:f.marca,Material:f.material,Color:f.color,'Queda (g)':f.resta,'Rollo (g)':f.rollo,'Costo por kg':f.costoKg})));
  add('Insumos',S.insumos.map(i=>({Material:i.nombre,Categoría:i.cat,Unidad:i.un,Cantidad:i.cant,Mínimo:i.min,'Costo unitario':i.costo})));
  add('Canales y parámetros',[...S.canales.map(c=>({Concepto:'Canal: '+c.nombre,'Comisión %':c.com,'Cargo fijo $':c.fijo})),
    {Concepto:'Costo por hora de impresión','Comisión %':'','Cargo fijo $':S.config.costoHora},
    {Concepto:'Margen objetivo %','Comisión %':'','Cargo fijo $':S.config.margenObjetivo},
    {Concepto:'Packaging por pedido (inicial)','Comisión %':'','Cargo fijo $':S.config.packaging}]);
  if(!wb.SheetNames.length)return toast('No hay datos para exportar todavía.');
  XLSX.writeFile(wb,'PIA-respaldo-'+new Date().toISOString().slice(0,10)+'.xlsx');
  toast('Listo: se descargó el archivo de Excel.');
}

/* ---------- Ingreso ---------- */
function showLogin(msg){$('#app').style.display='none';$('#login').style.display='flex';$('#lerr').textContent=msg||''}
async function entrar(){
  const email=$('#le').value.trim(),pass=$('#lp').value;if(!email||!pass)return;
  $('#lb').disabled=true;$('#lerr').textContent='';
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  $('#lb').disabled=false;
  if(error)return $('#lerr').textContent='Correo o contraseña incorrectos.';
  $('#lp').value='';await iniciar();
}
async function salir(){await sb.auth.signOut();S.email='';showLogin()}
async function iniciar(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return showLogin();
  const {data:permitido}=await sb.rpc('is_allowed');
  if(!permitido){await sb.auth.signOut();return showLogin('Ese correo no está autorizado para usar PIA.')}
  S.email=session.user.email;
  try{await load()}catch(e){return showLogin('No se pudieron cargar los datos: '+e.message)}
  $('#login').style.display='none';$('#app').style.display='grid';
  const h=(location.hash||'#panel').slice(1);S.view=VIEWS.some(v=>v[0]===h)?h:'panel';
  render();
}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
$('#lp').addEventListener('keydown',e=>{if(e.key==='Enter')entrar()});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(S.email&&VIEWS.some(v=>v[0]===h)&&h!==S.view){S.view=h;render()}});
iniciar();

</script>
</body>
</html>
